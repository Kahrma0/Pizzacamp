<div id="carrito" onclick="event.stopImmediatePropagation()">

    <button onclick="comprar()" style="margin-top:10px;">Comprar</button>

    <p id="mensaje-compra">¡Compra realizada! 🎉</p>
</div>
<button id="boton-carrito" onclick="toggleCarrito()">🛒</button>
